<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forest Community</title>

<link rel="stylesheet" href="community.css">

<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">

</head>

<body>

<header class="hero">

    <div class="hero-overlay">

        <a href="index.html" class="back-link">
            ← Back to Explorer
        </a>

        <h1 id="communityName">
            Loading...
        </h1>

        <p id="communitySubtitle"></p>

    </div>

</header>



<main class="container">

    <section class="section">

        <h2>Forest Community Overview</h2>

        <p id="communityDescription"></p>

    </section>



    <section class="section">

        <h2>Ecoregions</h2>

        <div id="ecoregions" class="tag-list"></div>

    </section>



    <section class="section">

        <h2>SWAP Priority Habitats</h2>

        <div id="habitats" class="tag-list"></div>

    </section>



    <section class="section">

        <h2>Priority Species</h2>

        <div id="species" class="tag-list"></div>

    </section>



    <section class="section">

        <h2>Forestry Considerations</h2>

        <ul id="managementList"></ul>

    </section>



    <section class="section">

        <h2>Threats</h2>

        <ul id="threatList"></ul>

    </section>



    <section class="section">

        <a
            id="factSheetButton"
            class="download-button"
            target="_blank"
        >
            Download FECV Fact Sheet (PDF)
        </a>

    </section>

</main>



<footer>

    University of Georgia |
    Georgia Sustainable Forestry Initiative

</footer>

<script src="community.js"></script>

</body>

</html>
